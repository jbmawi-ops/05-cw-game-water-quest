<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aqua Rush | charity: water</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <img class="logo" src="img/cw_logo.png" alt="charity: water logo">
    <h1>Aqua Rush</h1>
    <p class="tagline">Help bring clean water to people who need it.</p>

    <div class="stats">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">Time: <span id="timer">30</span>s</div>
    </div>

    <div id="game-grid" class="grid" aria-label="Game grid"></div>

    <p id="message" class="message" role="status" aria-live="polite"></p>

    <button id="start-btn" class="btn">Start Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
